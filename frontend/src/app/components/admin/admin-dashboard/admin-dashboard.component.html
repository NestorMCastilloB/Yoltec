<div class="admin-app">
  <app-admin-sidebar
    [activeSection]="activeSection"
    [adminName]="adminName"
    (sectionChange)="setSection($event)">
  </app-admin-sidebar>

  <div class="admin-body">

    <div class="admin-topbar">
      <div>
        <div class="admin-crumb">{{ sectionCrumb }}</div>
        <h1 class="admin-title">{{ sectionTitle }}</h1>
      </div>
      <div class="admin-user-wrap">
        <button class="admin-user-trigger" (click)="toggleUserMenu()">
          <div class="admin-user-avatar">{{ adminInitial }}</div>
          <span class="admin-user-name">{{ adminName }}</span>
          <span class="admin-chevron" [class.open]="userMenuOpen">▾</span>
        </button>
        @if (userMenuOpen) {
          <div class="admin-dropdown">
            <div class="admin-dropdown-header">
              <b>{{ adminName }}</b>
              <span>Administrador</span>
            </div>
            <div class="admin-dropdown-divider"></div>
            <button class="admin-dropdown-item" (click)="themeService.toggle()">
              <span>{{ themeService.isDark ? 'Modo claro' : 'Modo oscuro' }}</span>
              <span class="admin-theme-dot" [class.dark]="themeService.isDark"></span>
            </button>
            <div class="admin-dropdown-divider"></div>
            <button class="admin-dropdown-item danger" (click)="logout(); userMenuOpen = false">
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>

    <main class="admin-main">

      @if (activeSection === 'panel') {
        <app-admin-panel
          [stats]="stats"
          [panelUsuarios]="panelUsuarios"
          [diasProximos]="diasProximos"
          [isLoadingStats]="isLoadingStats"
          [isLoadingPanel]="isLoadingPanel"
          [fechaHoy]="fechaHoy"
          (navigateToUsuarios)="setSection('usuarios')"
          (navigateToCalendario)="setSection('calendario')">
        </app-admin-panel>
      }

      @if (activeSection === 'usuarios') {
        <app-admin-usuarios (changed)="onUsuariosChanged($event)"></app-admin-usuarios>
      }

      @if (activeSection === 'calendario') {
        <app-admin-calendario (changed)="onCalendarioChanged($event)"></app-admin-calendario>
      }

    </main>
  </div>
</div>
