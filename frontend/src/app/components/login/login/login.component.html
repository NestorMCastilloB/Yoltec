<div class="login-grid">
  <!-- Lado izquierdo: panel de bienvenida -->
  <div class="welcome-panel">
    <div class="welcome-content">
      <img src="./logo.jpeg" alt="Yoltec" class="welcome-logo">
      <h1>YOLTEC</h1>
      <p class="welcome-subtitle">Consultorio Medico Universitario</p>
      <p>Tu salud es lo primero. Accede a tus citas, recetas y evaluaciones.</p>
      <div class="decorative-line"></div>
    </div>
  </div>

  <!-- Lado derecho: formulario -->
  <div class="login-panel">
    <div class="login-header">
      <h2>Bienvenido</h2>
      <p>Elige tu tipo de cuenta para continuar</p>
    </div>

    <!-- Selector de roles -->
    <div class="roles-menu">
      <button class="role-btn" [class.active]="activeTab === 'student'" (click)="setActiveTab('student')">
        <span class="role-icon">&#9734;</span>
        <span class="role-name">Estudiante</span>
      </button>
      <button class="role-btn" [class.active]="activeTab === 'doctor'" (click)="setActiveTab('doctor')">
        <span class="role-icon">&#9764;</span>
        <span class="role-name">Doctor</span>
      </button>
    </div>

    <div class="form-container">
      <!-- Estudiante -->
      <form *ngIf="activeTab === 'student'" (ngSubmit)="onStudentLogin()" #studentForm="ngForm">
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <div class="form-group">
          <label>Número de control</label>
          <input type="text" [(ngModel)]="studentData.identificador" name="identificador"
            placeholder="Ej: 22690495" required>
        </div>
        <div class="form-group">
          <label>NIP</label>
          <div class="password-wrapper">
            <input [type]="showPasswordStudent ? 'text' : 'password'"
              [(ngModel)]="studentData.password" name="password" placeholder="6 digitos" required>
            <button type="button" class="toggle-password" (click)="togglePassword('student')">&#9919;</button>
          </div>
        </div>
        <button type="submit" class="login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Cargando...' : 'Iniciar sesión' }}
        </button>
        <div class="forgot-link-wrapper">
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
      </form>

      <!-- Doctor -->
      <form *ngIf="activeTab === 'doctor'" (ngSubmit)="onDoctorLogin()" #doctorForm="ngForm">
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" [(ngModel)]="doctorData.identificador" name="identificador"
            placeholder="Tu nombre de usuario" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <div class="password-wrapper">
            <input [type]="showPasswordDoctor ? 'text' : 'password'"
              [(ngModel)]="doctorData.password" name="password" placeholder="Tu contraseña" required>
            <button type="button" class="toggle-password" (click)="togglePassword('doctor')">&#9919;</button>
          </div>
        </div>
        <button type="submit" class="login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Cargando...' : 'Iniciar sesión' }}
        </button>
        <div class="forgot-link-wrapper">
          <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </div>
  </div>
</div>
